<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="favBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#05070E" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="favBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.8" />
    </linearGradient>

    <!-- Left 'A' (Alber) - Luminous Cyan to Electric Indigo -->
    <linearGradient id="favLeftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <!-- Right 'A' (Ashraf) - Electric Indigo to Royal Violet -->
    <linearGradient id="favRightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <radialGradient id="favCoreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0" />
    </radialGradient>

    <filter id="favGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Outer Glow -->
  <rect width="64" height="64" rx="16" fill="url(#favCoreGlow)" opacity="0.6" />

  <!-- Base Squircle Surface -->
  <rect width="62" height="62" x="1" y="1" rx="15" fill="url(#favBgGrad)" stroke="url(#favBorderGrad)" stroke-width="1.4" />

  <!-- Subtle Blueprint Grid Lines -->
  <path d="M12 32 H52 M32 12 V52" stroke="rgba(255,255,255,0.06)" stroke-width="1" stroke-dasharray="2 2" />

  <!-- The Architectural Dual-A Monogram -->
  <!-- Left 'A' Wing & Stem (Cyan -> Indigo) -->
  <path
    d="M32 13 L15 48 L22 48 L26.5 38 L37.5 38"
    stroke="url(#favLeftGrad)"
    stroke-width="4.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Right 'A' Wing & Stem (Indigo -> Violet) -->
  <path
    d="M32 13 L49 48 L42 48 L37.5 38 L26.5 38"
    stroke="url(#favRightGrad)"
    stroke-width="4.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Nested Inner Architectural Delta 'A' -->
  <path
    d="M32 23 L23 42 H41 Z"
    stroke="url(#favBorderGrad)"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="rgba(6, 182, 212, 0.08)"
  />

  <!-- Central Full-Stack Core Node -->
  <rect
    x="29.5"
    y="35.5"
    width="5"
    height="5"
    rx="1"
    transform="rotate(45 32 38)"
    fill="#FFFFFF"
    filter="url(#favGlow)"
  />
  <circle cx="32" cy="38" r="1.4" fill="#06B6D4" />

  <!-- Apex Radiant Crown Node -->
  <circle cx="32" cy="13" r="2.4" fill="#FFFFFF" filter="url(#favGlow)" />
  <circle cx="32" cy="13" r="1.2" fill="#6366F1" />
</svg>
